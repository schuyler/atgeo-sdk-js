name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every commit on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Skips the browser job when every changed file is documentation.
  changes:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (a new branch, a force-push, unrelated histories): run everything.
          if ! files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null) || [ -z "$files" ]; then
            echo browser=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if grep -qvE '(\.md$|^LICENSE)' <<<"$files"; then
            echo browser=true >> "$GITHUB_OUTPUT"
          else
            echo browser=false >> "$GITHUB_OUTPUT"
          fi

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser

  # test/lexicon is what its SOURCE says: garganorn's lexicons at the named commit. A pin that has
  # fallen behind garganorn's default branch is a warning annotation, not a failure.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/check-fixtures.sh --lexicon test/lexicon

  # The one check to mark required. A skipped browser job passes; a failed or
  # cancelled job anywhere fails this.
  ci:
    needs: [test, changes, browser, fixtures]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
